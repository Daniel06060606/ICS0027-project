services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_HOST: db
      DB_USER: password_manager
      DB_PASSWORD: ${DB_PASSWORD:-local-development-password}
      DB_NAME: password_manager
      APP_ORIGIN: https://localhost:3000
      PORT: 3000
    volumes:
      - certificates:/app/certs
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: password_manager
      MYSQL_USER: password_manager
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-development-password}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  database:
  certificates:
